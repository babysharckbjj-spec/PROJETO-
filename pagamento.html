<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essenza+ | Pagamento</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <a href="inicio.html" class="logo">
        ESSENZA<span>+</span>
    </a>

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Busque por perfume..."
        >

    </div>

    <a href="carrinho.html" class="cart">

        🛒 Carrinho

        <span id="cartCount">
            0
        </span>

    </a>

</header>

<nav>

    <a href="inicio.html">Início</a>
    <a href="perfumes.html">Perfumes</a>
    <a href="feminino.html">Feminino</a>
    <a href="masculino.html">Masculino</a>
    <a href="sobre.html">Sobre nós</a>
    <a href="contato.html">Contato</a>

</nav>

<section class="page-title">

    <span>ESSENZA+</span>

    <h1>
        Finalizar pedido
    </h1>

    <p>
        Preencha seus dados para concluir sua compra.
    </p>

</section>

<main class="checkout-page">

    <div class="container">

        <div class="form-box">

            <form id="checkoutForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="pagamento">
                            Forma de pagamento
                        </label>

                        <select id="pagamento" required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="pix">
                                PIX
                            </option>

                            <option value="cartao">
                                Cartão
                            </option>

                            <option value="boleto">
                                Boleto
                            </option>

                        </select>

                    </div>

                    <div class="form-group full">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="cep">
                            CEP
                        </label>

                        <input
                            type="text"
                            id="cep"
                            required
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn gold"
                >
                    Finalizar pedido
                </button>

                <p
                    id="checkoutMessage"
                    class="form-message"
                ></p>

            </form>

        </div>

    </div>

</main>

<footer>

    <div class="footer-logo">
        ESSENZA<span>+</span>
    </div>

    <p>
        Perfumes que transformam momentos em memórias.
    </p>

    <div class="copyright">
        © 2026 Essenza+. Todos os direitos reservados.
    </div>

</footer>

<script src="codigo.js"></script>

</body>
</html>
